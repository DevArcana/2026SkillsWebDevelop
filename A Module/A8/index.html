
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장바구니</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="box">

            <!-- 제목 -->
            <div class="title">
                <h1>장바구니</h1>
            </div>

            <!-- 상품 1 -->
            <div class="items">

                <div class="left">
                    <img src="images/tshirt.jpg" alt="티셔츠">

                    <div class="item-info">
                        <div class="item-name">
                            WorldSkills 공식 티셔츠
                        </div>
                        <div>색상: 네이비</div>
                        <div>사이즈: L</div>
                    </div>
                </div>

                <div class="right">
                    <div class="quantity">
                        <span>-</span>
                        <span>2</span>
                        <span>+</span>
                    </div>

                    <div class="item-total">25,000원</div>

                    <div class="exit">×</div>
                </div>

            </div>

            <!-- 상품 2 -->
            <div class="items">

                <div class="left">
                    <img src="images/book.jpg" alt="가이드북">

                    <div class="item-info">
                        <div class="item-name">
                            기능경기 가이드북
                        </div>
                        <div>종목: 웹디자인</div>
                        <div>2026년 최신판</div>
                    </div>
                </div>

                <div class="right">
                    <div class="quantity">
                        <span>-</span>
                        <span>1</span>
                        <span>+</span>
                    </div>

                    <div class="item-total">15,000원</div>

                    <div class="exit">×</div>
                </div>

            </div>

            <!-- 상품 3 -->
            <div class="items">

                <div class="left">
                    <img src="images/laptop-case.jpg" alt="노트북 파우치">

                    <div class="item-info">
                        <div class="item-name">
                            WorldSkills 노트북 파우치
                        </div>
                        <div>색상: 블랙</div>
                        <div>15인치 호환</div>
                    </div>
                </div>

                <div class="right">
                    <div class="quantity">
                        <span>-</span>
                        <span>1</span>
                        <span>+</span>
                    </div>

                    <div class="item-total">35,000원</div>

                    <div class="exit">×</div>
                </div>

            </div>

            <!-- 결제 금액 -->
            <div class="total">

                <div>
                    <span>상품금액</span>
                    <span>75,000원</span>
                </div>

                <div>
                    <span>배송비</span>
                    <span>3,000원</span>
                </div>

                <div class="final-total">
                    <span>총 결제금액</span>
                    <span>78,000원</span>
                </div>

            </div>

            <!-- 하단 버튼 -->
            <div class="buttons">
                <button class="continue">쇼핑 계속하기</button>
                <button class="order">주문하기</button>
            </div>

        </div>

    </div>

</body>
</html>
